name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site with config from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir _site
          cp index.html app.js style.css _site/
          # キャッシュ対策：CSS/JS の参照にコミットIDを付けて、更新時に必ず読み直させる
          V=${GITHUB_SHA::7}
          sed -i "s#href=\"style.css\"#href=\"style.css?v=$V\"#; s#src=\"config.js\"#src=\"config.js?v=$V\"#; s#src=\"app.js\"#src=\"app.js?v=$V\"#" _site/index.html
          cat > _site/config.js <<EOF
          window.APP_CONFIG = {
            SUPABASE_URL: '${SUPABASE_URL}',
            SUPABASE_KEY: '${SUPABASE_KEY}',
          };
          EOF

      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
